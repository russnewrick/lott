<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Lottery Number Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #d62839 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .layout {
            display: flex;
            width: min(1100px, 100%);
            min-height: 760px;
            background: linear-gradient(135deg, rgba(19, 48, 96, 0.98) 0%, rgba(36, 85, 165, 0.95) 55%, rgba(214, 40, 57, 0.9) 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background: rgba(237, 244, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.25);
            padding: 28px 20px;
            backdrop-filter: blur(2px);
        }

        .sidebar h2 {
            color: #1e3c72;
            font-size: 22px;
            margin-bottom: 18px;
        }

        .game-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-item {
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .game-item:hover,
        .game-item.active {
            background: linear-gradient(135deg, rgba(214, 40, 57, 0.95) 0%, rgba(255, 255, 255, 0.92) 100%);
            border-color: rgba(255, 255, 255, 0.9);
            color: #1e3c72;
            transform: translateX(2px);
        }

        .content-panel {
            flex: 1;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
        }

        .country-switcher {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .country-flag {
            width: 40px;
            height: 26px;
            object-fit: cover;
            border: 1px solid rgba(30, 60, 114, 0.2);
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        .country-switcher select {
            min-height: 42px;
            padding: 8px 12px;
            border: 1px solid rgba(30, 60, 114, 0.25);
            border-radius: 8px;
            background: #fff;
            color: #24344d;
            font: inherit;
            cursor: pointer;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .button-group button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .button-group button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .generate-btn {
            background: linear-gradient(135deg, #d62839 0%, #f4a6ad 100%);
            color: #1e3c72;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.7);
            color: #1d2e4a;
        }

        .ticket-section {
            background: linear-gradient(135deg, rgba(18, 31, 70, 0.9) 0%, rgba(39, 74, 138, 0.9) 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .ticket-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .numbers-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .numbers-display {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .number-ball,
        .bonus-ball,
        .empty-ball {
            width: 50px;
            height: 50px;
            flex: 0 0 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: popIn 0.3s ease-out;
        }

        .number-ball {
            background: #fff;
            color: #1e3c72;
        }

        .bonus-ball {
            background: #d62839;
            color: #fff;
            position: relative;
        }

        .bonus-ball::before {
            content: '★';
            position: absolute;
            font-size: 12px;
            top: 2px;
            opacity: 0.5;
        }

        .empty-ball {
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.5);
            color: #fff;
            font-size: 24px;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .stats,
        .history {
            background: rgba(249, 249, 249, 0.9);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-title {
            color: #1e3c72;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            color: #555;
            font-size: 14px;
            border-bottom: 1px solid #e0e0e0;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .history {
            padding: 15px;
        }

        .history h3 {
            color: #1e3c72;
            font-size: 14px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            background: #fff;
            border-left: 4px solid #d62839;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .history-item strong {
            color: #1e3c72;
        }

        .info-box {
            background: rgba(227, 242, 253, 0.9);
            border-left: 4px solid #d62839;
            padding: 12px;
            border-radius: 5px;
            font-size: 13px;
            color: #1e3c72;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #dfeafc;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }

            .content-panel {
                padding: 24px 18px;
            }

            h1 {
                font-size: 26px;
            }

            .number-ball,
            .bonus-ball,
            .empty-ball {
                width: 42px;
                height: 42px;
                flex-basis: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>Draw Games</h2>
            <div class="game-menu" id="gameMenu">
                <button type="button" class="game-item active" data-game="powerball">Powerball</button>
                <button type="button" class="game-item" data-game="megamillions">Mega Millions</button>
            </div>
        </aside>

        <main class="content-panel">
            <div class="country-switcher">
                <img class="country-flag" src="us-flag.svg" alt="United States flag">
                <select id="countrySelect" aria-label="Choose country">
                    <option value="uk">🇬🇧 United Kingdom</option>
                    <option value="us" selected>🇺🇸 United States</option>
                </select>
            </div>
            <h1 id="pageTitle">Powerball</h1>
            <p class="subtitle">Random number generator</p>

            <div class="info-box" id="gameInfo"></div>

            <div class="button-group">
                <button type="button" class="generate-btn" id="generateButton">Generate Numbers</button>
                <button type="button" class="reset-btn" id="resetButton">Clear</button>
            </div>

            <div class="ticket-section">
                <div class="ticket-label">Your Numbers</div>
                <div class="numbers-section">
                    <div class="section-title" id="mainLabel"></div>
                    <div class="numbers-display" id="mainNumbers"></div>
                </div>
                <div class="numbers-section">
                    <div class="section-title" id="bonusLabel"></div>
                    <div class="numbers-display" id="bonusNumbers"></div>
                </div>
            </div>

            <div class="stats">
                <div class="stats-title">Ticket Statistics</div>
                <div class="stat-row">
                    <span>Total Generated:</span>
                    <strong id="totalTickets">0</strong>
                </div>
            </div>

            <div class="history">
                <h3>Generated Tickets</h3>
                <div class="history-list" id="historyList"></div>
            </div>
            <p class="subtitle" style="margin: 18px 0 0;">Numbers are randomly generated and do not improve the chance of winning. Please play responsibly.</p>
        </main>
    </div>

    <script>
        const games = {
            powerball: {
                name: 'Powerball',
                mainCount: 5,
                mainMax: 69,
                mainLabel: 'White Balls',
                bonusMax: 26,
                bonusLabel: 'Powerball',
                instruction: 'Choose 5 white balls from 1-69 and 1 Powerball from 1-26.'
            },
            megamillions: {
                name: 'Mega Millions',
                mainCount: 5,
                mainMax: 70,
                mainLabel: 'White Balls',
                bonusMax: 24,
                bonusLabel: 'Mega Ball',
                instruction: 'Choose 5 white balls from 1-70 and 1 Mega Ball from 1-24.'
            }
        };

        let selectedGame = 'powerball';
        let ticketHistory = [];

        function currentGame() {
            return games[selectedGame];
        }

        function generateUniqueNumbers(max, count) {
            const numbers = Array.from({ length: max }, (_, index) => index + 1);
            for (let index = 0; index < count; index++) {
                const randomIndex = index + Math.floor(Math.random() * (numbers.length - index));
                [numbers[index], numbers[randomIndex]] = [numbers[randomIndex], numbers[index]];
            }
            return numbers.slice(0, count);
        }

        function resetTicketDisplay() {
            const game = currentGame();
            document.getElementById('mainNumbers').innerHTML =
                Array.from({ length: game.mainCount }, () => '<div class="empty-ball">?</div>').join('');
            document.getElementById('bonusNumbers').innerHTML = '<div class="empty-ball">?</div>';
        }

        function updateGame() {
            const game = currentGame();
            document.getElementById('pageTitle').textContent = game.name;
            document.getElementById('gameInfo').textContent = game.instruction;
            document.getElementById('mainLabel').textContent = `${game.mainLabel} (1-${game.mainMax})`;
            document.getElementById('bonusLabel').textContent = `${game.bonusLabel} (1-${game.bonusMax})`;
            document.querySelectorAll('.game-item').forEach(button => {
                button.classList.toggle('active', button.dataset.game === selectedGame);
            });
            resetTicketDisplay();
        }

        function updateHistory() {
            const historyList = document.getElementById('historyList');
            if (!ticketHistory.length) {
                historyList.innerHTML = '<div style="color: #999; font-size: 13px;">No tickets generated yet</div>';
                return;
            }

            historyList.innerHTML = ticketHistory.map((item, index) => `
                <div class="history-item">
                    <strong>#${index + 1} ${item.game}</strong>: ${item.ticket}<br>
                    <span style="font-size: 11px; color: #999;">${item.date}</span>
                </div>
            `).join('');
        }

        function generateTicket() {
            const game = currentGame();
            const mainNumbers = generateUniqueNumbers(game.mainMax, game.mainCount).sort((a, b) => a - b);
            const bonusNumber = generateUniqueNumbers(game.bonusMax, 1)[0];

            document.getElementById('mainNumbers').innerHTML = mainNumbers
                .map(number => `<div class="number-ball">${number}</div>`).join('');
            document.getElementById('bonusNumbers').innerHTML = `<div class="bonus-ball">${bonusNumber}</div>`;

            ticketHistory.unshift({
                game: game.name,
                ticket: `${mainNumbers.join(', ')} | ${game.bonusLabel}: ${bonusNumber}`,
                date: new Date().toLocaleString()
            });
            ticketHistory = ticketHistory.slice(0, 10);
            updateHistory();
            document.getElementById('totalTickets').textContent = ticketHistory.length;
        }

        function resetGenerator() {
            ticketHistory = [];
            resetTicketDisplay();
            updateHistory();
            document.getElementById('totalTickets').textContent = '0';
        }

        document.querySelectorAll('.game-item').forEach(button => {
            button.addEventListener('click', () => {
                selectedGame = button.dataset.game;
                updateGame();
            });
        });

        document.getElementById('generateButton').addEventListener('click', generateTicket);
        document.getElementById('resetButton').addEventListener('click', resetGenerator);
        document.getElementById('countrySelect').addEventListener('change', event => {
            if (event.target.value === 'uk') {
                window.location.href = 'euromillions-generator.html';
            }
        });
        document.addEventListener('keypress', event => {
            if (event.key === 'Enter') generateTicket();
        });

        updateHistory();
        updateGame();
    </script>
</body>
</html>
